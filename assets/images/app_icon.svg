  </defs>
  
  <!-- Background Circle -->
  <circle cx="512" cy="512" r="512" fill="url(#bg-gradient)"/>
  
  <!-- Letter M with modern design -->
  <path d="M 280 700 L 280 324 L 400 480 L 512 324 L 624 480 L 744 324 L 744 700 L 644 700 L 644 480 L 512 620 L 380 480 L 380 700 Z" 
