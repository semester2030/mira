      <stop offset="0%" stop-color="#FADAE9" />
      <stop offset="50%" stop-color="#E86FA9" />
      <stop offset="100%" stop-color="#C95889" />
    </linearGradient>
    <linearGradient id="letter-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF7FA" />
