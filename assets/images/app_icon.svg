  <!-- Decorative dots -->
  <circle cx="512" cy="780" r="20" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="460" cy="780" r="12" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="564" cy="780" r="12" fill="#FFFFFF" opacity="0.6"/>
  
