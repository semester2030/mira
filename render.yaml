# Render Blueprint — نشر mira-api
# Dashboard: https://dashboard.render.com/blueprints → New Blueprint Instance → ربط repo semester2030/mira

databases:
  - name: mira-db
    plan: free
    databaseName: mira_db
    user: mira

services:
  - type: web
    name: mira-api
    runtime: node
    rootDir: mira-api
    plan: free
    # NODE_ENV=production يمنع تثبيت devDependencies — نحتاج nest/cli و prisma و @types/*
    buildCommand: NPM_CONFIG_PRODUCTION=false npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api/v1
      - key: SKIN_PROVIDER
        value: perfect_corp
      - key: OUTFIT_PROVIDER
        value: mock
      - key: PERFECT_API_KEY
        sync: false
      - key: PERFECT_BASE_URL
        value: https://yce-api-01.makeupar.com/s2s/v2.0
      - key: PERFECT_CORP_FALLBACK_MOCK
        value: "true"
      - key: FASHN_API_KEY
        sync: false
      - key: FASHN_BASE_URL
        sync: false
      - key: FASHN_GEOMETRY_ENDPOINT
        value: /v1/segmentation
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: LLM_TEMPERATURE
        value: "0.2"
      - key: AUTH_SKIP
        value: "false"
      - key: RATE_LIMIT_PER_HOUR
        value: "30"
      - key: DATABASE_URL
        fromDatabase:
          name: mira-db
          property: connectionString
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false
      - key: WEBSITE_CORS_ORIGINS
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: PARTNER_AUTO_APPROVE
        value: "false"

  - type: web
    name: mira-partners-portal
    runtime: static
    rootDir: partners-portal/web
    buildCommand: echo "partners portal ready"
    staticPublishPath: .

  - type: web
    name: mira-admin-portal
    runtime: static
    rootDir: admin-portal/web
    buildCommand: echo "admin portal ready"
    staticPublishPath: .

  - type: web
    name: mira-website
    runtime: static
    rootDir: website
    buildCommand: echo "static site ready"
    staticPublishPath: .
