<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="mira-api-base" content="https://mira-api-n4p3.onrender.com/api/v1" />
  <title>إدارة الطلبات — ميرا (داخلي)</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <header>
    <div class="container wrap">
      <a class="brand" href="index.html">ميرا · Admin</a>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <h1>طلبات الشراكة</h1>
      <p class="lead">صفحة داخلية — أدخل مفتاح الإدارة (X-Admin-Key) من Render env.</p>
      <label>Admin API Key</label>
      <input id="adminKey" type="password" placeholder="ADMIN_API_KEY" />
      <div class="actions">
        <button id="loadBtn" class="btn btn-primary">تحميل الطلبات</button>
      </div>
      <div id="msg" class="hidden"></div>
      <div id="list" style="margin-top:1rem"></div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    const keyInput = document.getElementById('adminKey');
    if (localStorage.getItem('mira_admin_key')) {
      keyInput.value = localStorage.getItem('mira_admin_key');
    }

    document.getElementById('loadBtn').onclick = load;

    async function load() {
      const key = keyInput.value.trim();
      if (!key) return alert('أدخل المفتاح');
      localStorage.setItem('mira_admin_key', key);

      const msg = document.getElementById('msg');
      const list = document.getElementById('list');
      msg.className = 'alert warn';
      msg.textContent = 'جاري التحميل...';
      msg.classList.remove('hidden');

      try {
        const apps = await PartnersApi.adminList(key, 'pending');
        msg.classList.add('hidden');

        list.replaceChildren();
        if (!apps.length) {
          const empty = document.createElement('p');
          empty.className = 'lead';
          empty.textContent = 'لا طلبات معلّقة.';
          list.appendChild(empty);
          return;
        }

        for (const application of apps) {
          const item = document.createElement('div');
          item.className = 'list-item';
          item.dataset.id = application.id;
          const title = document.createElement('strong');
          title.textContent = application.nameAr || '';
          const meta = document.createElement('small');
          meta.textContent = (application.contactName || '') + ' · ' + (application.contactPhone || '') + ' · ' + (application.city || '');
          const actions = document.createElement('div');
          actions.className = 'actions';
          const approve = document.createElement('button');
          approve.className = 'btn btn-primary approve';
          approve.textContent = 'اعتماد';
          const reject = document.createElement('button');
          reject.className = 'btn btn-danger reject';
          reject.textContent = 'رفض';
          actions.append(approve, reject);
          const result = document.createElement('div');
          result.className = 'result hidden';
          item.append(title, document.createTextNode(' (' + (application.type || '') + ') — ' + (application.contactEmail || '')), document.createElement('br'), meta, actions, result);
          list.appendChild(item);
        }

        list.querySelectorAll('.approve').forEach((btn) => {
          btn.onclick = async () => {
            const item = btn.closest('.list-item');
            const id = item.dataset.id;
            try {
              const res = await PartnersApi.adminApprove(key, id);
              const result = item.querySelector('.result');
              result.className = 'alert ok';
              result.replaceChildren();
              result.append(document.createTextNode('تم! partnerId: ' + res.partnerId));
              const token = document.createElement('div');
              token.className = 'token-box';
              token.textContent = res.accessToken || '';
              result.append(document.createElement('br'), document.createTextNode('accessToken:'), token);
              btn.disabled = true;
            } catch (e) {
              alert(e.message);
            }
          };
        });

        list.querySelectorAll('.reject').forEach((btn) => {
          btn.onclick = async () => {
            const reason = prompt('سبب الرفض (اختياري):');
            const item = btn.closest('.list-item');
            try {
              await PartnersApi.adminReject(key, item.dataset.id, reason || undefined);
              item.remove();
            } catch (e) {
              alert(e.message);
            }
          };
        });
      } catch (err) {
        msg.className = 'alert err';
        msg.textContent = err.message;
      }
    }
  </script>
</body>
</html>
