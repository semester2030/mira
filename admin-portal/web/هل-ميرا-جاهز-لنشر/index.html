<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="mira-api-base" content="https://mira-api-n4p3.onrender.com/api/v1" />
  <meta name="description" content="موقع إداري لتقييم جاهزية ميرا لـ App Store وGoogle Play — يتطلب مفتاح الإدارة." />
  <meta name="robots" content="noindex,nofollow" />
  <title>هل ميرا جاهز لنشر · إدارة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/gate.css" />
</head>
<body>
  <div id="bootError" class="login-screen">
    <div class="login-card">
      <h1>هل ميرا جاهز لنشر</h1>
      <p id="bootErrorText">هذا الموقع خاص بالإدارة. أدخلي مفتاح الإدارة للمتابعة.</p>
      <div id="adminKeyWrap">
        <label class="field" style="display:block;margin:1rem 0;text-align:right">
          مفتاح الإدارة
          <input id="adminKeyInput" type="password" autocomplete="current-password" style="width:100%;margin-top:.35rem;padding:.55rem .7rem;border-radius:8px;border:1px solid #ccc" />
        </label>
      </div>
      <button id="retryBtn" class="btn btn-primary" type="button">دخول</button>
    </div>
  </div>

  <div id="backdrop" class="backdrop"></div>
  <div id="appShell" class="app-shell hidden">
    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <strong>هل ميرا جاهز لنشر</strong>
        <small>إدارة · مفتاح مطلوب</small>
      </div>
      <nav class="nav">
        <button type="button" class="active" data-view="home">اللوحة</button>
        <button type="button" data-view="blockers">موانع النشر</button>
        <button type="button" data-view="journeys">رحلات ميرا</button>
        <button type="button" data-view="requirements">متطلبات المتجرين</button>
        <button type="button" data-view="gaps">ما ينقص ميرا</button>
        <button type="button" data-view="clips">أداء المقاطع والتفاعل</button>
        <button type="button" data-view="evidence">الأدلة وسجل إعادة الاختبار</button>
      </nav>
    </aside>
    <main class="main">
      <div class="topbar">
        <div>
          <button id="menuToggle" class="btn btn-ghost menu-toggle" type="button">القائمة</button>
          <h2 id="pageTitle">هل ميرا جاهز لنشر</h2>
          <p id="pageSubtitle">سجل إداري — غير متاح للزائر</p>
        </div>
      </div>
      <div id="viewRoot"></div>
    </main>
  </div>
  <script src="js/gate.js"></script>
</body>
</html>
