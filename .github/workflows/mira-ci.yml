name: Mira CI

on:
  push:
    branches: [main, master, 'cursor/**']
  pull_request:

jobs:
  phase0-phase1-api:
    name: Nest Phase 0+1+2 integrity (blocking)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mira-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mira-api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Build
        run: npm run build
      - name: Phase 0 integrity (blocking)
        run: node dist/config/phase0-integrity.schema-tests.js
      - name: Phase 1 ports (blocking)
        run: node dist/ports/phase1-ports.schema-tests.js
      - name: Phase 2 image quality (blocking)
        run: node dist/ports/phase2-image-quality.schema-tests.js
      - name: Phase 2.1 verification (blocking)
        run: node dist/ports/phase2_1-verification.schema-tests.js
      - name: Production config safety sample
        run: |
          NODE_ENV=production \
          PERFECT_CORP_FALLBACK_MOCK=false \
          SKIN_PROVIDER=perfect_corp \
          MOCK_PROVIDER_ACCESS=false \
          FASHION_PROVIDER=vision_platform \
          BEAUTY_TRYON_ENABLED=false \
          node -e "require('./dist/ports/config/provider-ports.config').assertProviderPortsConfig(process.env); console.log('config ok')"

  flutter-checks:
    name: Flutter analyze + Phase 0/2 tests (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Format check (non-blocking debt if pre-existing drift)
        continue-on-error: true
        run: dart format --set-exit-if-changed lib test || true
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Phase 0 + Phase 2 + beauty score tests
        run: flutter test test/phase0_truth_safety_test.dart test/beauty_score_engine_test.dart test/phase2_image_quality_test.dart test/face_gate_rules_test.dart test/face_mesh_quality_gate_test.dart

  secret-scan:
    name: Basic secret scan (blocking on high-confidence patterns)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for private keys / obvious tokens
        run: |
          set -e
          if grep -RInE 'BEGIN (RSA |OPENSSH )?PRIVATE KEY' --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=build --exclude-dir=.dart_tool . ; then
            echo "Private key material found"
            exit 1
          fi
          echo "No private key blocks found"
